name: Generate Snake Contribution Animation

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: razashoeb840
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00f5ff
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f5ff

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg || true
          git commit -m "chore: auto-update contribution snake animation [skip ci]" || true
          git push origin main || true
